<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yellow Team Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      /* Yellow/Gold tinted background for the Yellow Team */
      background-image: linear-gradient(rgba(180, 140, 0, 0.7), rgba(120, 90, 0, 0.9)), url('https://assets.nintendo.com/image/upload/q_auto:best/f_auto/dpr_2.0/store/software/switch/70010000069639/8248e2edec2e8c106a26cb174fd4ae108207cf21ffd6012704f60ef5540cb79c');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #fff;
    }

    .tracker-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
      width: 100%;
      max-width: 400px;
      color: #333;
      text-align: center;
    }

    /* Using a darker gold/yellow for readability */
    h2 { margin-top: 0; color: #d39e00; font-size: 26px; border-bottom: 3px solid #d39e00; padding-bottom: 10px; }
    
    .balance-box {
      background-color: #fffdf5;
      border: 2px solid #d39e00;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    
    .balance-amount { font-size: 32px; font-weight: bold; color: #d39e00; margin: 10px 0 0 0; }

    form { display: flex; flex-direction: column; gap: 15px; }
    input, select, button { padding: 12px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; width: 100%; }
    input[type="number"], select, input[type="password"] { background-color: #fdfdfd; }
    
    button { background-color: #d39e00; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #b38600; }
    
    #status { margin-top: 15px; font-weight: bold; }

    /* Hide main screen initially for PIN protection */
    #mainScreen { display: none; }

    @media (max-width: 768px) {
      body { background-attachment: scroll; background-position: top center; }
    }
  </style>
</head>
<body>

  <!-- PIN LOGIN SCREEN -->
  <div class="tracker-container" id="loginScreen">
    <h2>Access Required</h2>
    <p>Enter the Yellow Team PIN to access the dashboard.</p>
    <input type="password" id="pinInput" placeholder="Enter PIN">
    <button onclick="checkPin()" style="margin-top: 15px;">Unlock</button>
    <p id="pinStatus" style="color: red; font-weight: bold;"></p>
  </div>

  <!-- MAIN DASHBOARD SCREEN -->
  <div class="tracker-container" id="mainScreen">
    <h2>Yellow Team Hub</h2>
    
    <!-- Balance Display -->
    <div class="balance-box">
      <div>Current Balance:</div>
      <div class="balance-amount" id="displayBalance">Loading...</div>
    </div>

    <!-- Hidden teamColor input so the user doesn't have to select it -->
    <form id="leadForm">
      <input type="hidden" name="teamColor" value="Yellow">
      <input type="number" name="amount" placeholder="Money Amount" step="1" min="1" required>
      <select name="action" required>
        <option value="" disabled selected>Select Action...</option>
        <option value="add">Add Cash</option>
        <option value="reduce">Reduce Cash</option>
      </select>
      <button type="submit" id="submitBtn">Update Balance</button>
    </form>
    <p id="status"></p>
  </div>

  <script>
    // --- SECURITY SETTINGS ---
    const CORRECT_PIN = "4565"; // SET A UNIQUE PIN FOR THE YELLOW TEAM HERE
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwZBAWDiAETsf4Aax0RRqpBaENOeNUgFhneX_duZtcVEECrgO9FhTu9yaaR3m5Hn1h_/exec'; 

    // --- PIN LOGIC ---
    function checkPin() {
      const input = document.getElementById('pinInput').value;
      if (input === CORRECT_PIN) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        fetchCurrentBalance(); // Load balance once unlocked
      } else {
        document.getElementById('pinStatus').innerText = "Incorrect PIN!";
      }
    }

    // --- FETCH BALANCE LOGIC ---
    function fetchCurrentBalance() {
      document.getElementById('displayBalance').innerText = "Loading...";
      
      // Changed to "team=Yellow"
      fetch(scriptURL + "?action=getBalance&team=Yellow")
        .then(response => response.json())
        .then(data => {
          if (data.balance !== undefined) {
            document.getElementById('displayBalance').innerText = data.balance;
          } else {
            document.getElementById('displayBalance').innerText = "Error";
          }
        })
        .catch(error => {
          document.getElementById('displayBalance').innerText = "Offline";
        });
    }

    // --- SUBMIT FORM LOGIC ---
    const form = document.getElementById('leadForm');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.disabled = true;
      status.textContent = 'Updating...';
      status.style.color = 'black';

      fetch(scriptURL, { method: 'POST', body: new FormData(form) })
        .then(response => {
          status.textContent = 'Success! Updating balance...';
          status.style.color = 'green';
          form.reset();
          submitBtn.disabled = false;
          
          // Refresh the balance display automatically after 1 second
          setTimeout(fetchCurrentBalance, 1000); 
          
          // Clear success message after 3 seconds
          setTimeout(() => { status.textContent = ''; }, 3000);
        })
        .catch(error => {
          status.textContent = 'Error updating balance.';
          status.style.color = 'red';
          submitBtn.disabled = false;
        });
    });
  </script>

</body>
</html>
